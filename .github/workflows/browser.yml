name: Browser
on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start Browser + Tunnel
        run: |
          export DEBIAN_FRONTEND=noninteractive

          echo "=== [1/7] Installing packages ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq tigervnc-standalone-server tigervnc-common novnc websockify openbox dbus-x11 x11-xserver-utils wget fonts-liberation fonts-noto-cjk 2>/dev/null

          echo "=== [2/7] Installing Chrome ==="
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb 2>/dev/null || true
          sudo apt-get -f install -y -qq 2>/dev/null

          echo "=== [3/7] Setting VNC password ==="
          mkdir -p ~/.vnc
          echo "xerin2026" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          echo "=== [4/7] Creating desktop config ==="
          cat > ~/.vnc/xstartup << 'XSTARTUP'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export DISPLAY=:1
          openbox &
          sleep 2
          google-chrome --no-sandbox --disable-gpu --no-first-run --disable-dev-shm-usage --start-fullscreen "https://www.google.com" &
          XSTARTUP
          chmod +x ~/.vnc/xstartup

          echo "=== [5/7] Starting VNC server ==="
          vncserver -kill :1 2>/dev/null || true
          vncserver :1 -geometry 1280x720 -depth 24 -localhost yes

          echo "=== [6/7] Starting noVNC web interface ==="
          sudo ln -sf /usr/share/novnc/vnc.html /usr/share/novnc/index.html 2>/dev/null || true
          websockify --web /usr/share/novnc 6080 localhost:5901 &
          sleep 3

          echo "=== [7/7] Installing Cloudflare Tunnel ==="
          wget -q "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" -O /tmp/cloudflared
          chmod +x /tmp/cloudflared

          echo ""
          echo "============================================"
          echo "  VNC Password: xerin2026"
          echo "  Look for trycloudflare.com URL below!"
          echo "============================================"
          echo ""

          /tmp/cloudflared tunnel --url http://localhost:6080
